name: JD -> LinkedIn Xray -> GitHub-only email

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      job_description:
        description: 'Paste the JD: role, skills, experience, location, notice period'
        required: true
        type: string
      candidate_pairs_csv:
        description: 'Optional private CSV: name,linkedin_url,github_url (no emails or phone numbers)'
        required: false
        default: ''
        type: string
      live_xray:
        description: 'Search public LinkedIn index through Brave API (requires configured secret)'
        required: true
        type: boolean
        default: false
      confirm_free_search:
        description: 'I confirmed free Brave credits and set account prepay to 0; no paid overage'
        required: true
        type: boolean
        default: false
      max_queries:
        description: 'Maximum Brave searches: 1, 2 or 3'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
        default: '2'
      max_profiles:
        description: 'Maximum candidate results'
        type: choice
        options:
          - '5'
          - '10'
          - '25'
          - '50'
        default: '25'

permissions:
  contents: read
  issues: read

concurrency:
  group: hirefloww-jd-xray-github
  cancel-in-progress: false

jobs:
  source-github:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[HIREFLOWW_JD]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Parse JD, run allowed X-ray, and enrich from GitHub only
        env:
          JD_TEXT: ${{ github.event_name == 'issues' && github.event.issue.body || inputs.job_description }}
          CANDIDATE_PAIRS_CSV: ${{ inputs.candidate_pairs_csv || '' }}
          USE_XRAY: ${{ inputs.live_xray || 'false' }}
          CONFIRM_FREE: ${{ inputs.confirm_free_search || 'false' }}
          MAX_QUERIES: ${{ github.event_name == 'issues' && '1' || inputs.max_queries }}
          MAX_PROFILES: ${{ github.event_name == 'issues' && '10' || inputs.max_profiles }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p results
          chmod 700 results
          set -- --jd-text "$JD_TEXT" --pairs-env \
            --max-queries "$MAX_QUERIES" --max-profiles "$MAX_PROFILES" \
            --output-dir results/jd-github
          if [ "$USE_XRAY" = "true" ]; then set -- "$@" --live-xray; fi
          if [ "$CONFIRM_FREE" = "true" ]; then set -- "$@" --confirm-free-search; fi
          python scripts/jd_linkedin_github.py "$@"
      - name: Upload private results for repository collaborators (1 day)
        uses: actions/upload-artifact@v4
        with:
          name: jd-github-results-${{ github.run_id }}
          path: results/jd-github/
          retention-days: 1
          if-no-files-found: error
      - name: Log privacy-safe status
        run: |
          echo "## Hirefloww JD → LinkedIn X-ray → GitHub email" >> "$GITHUB_STEP_SUMMARY"
          echo "Only public GitHub profile and commit emails were used for enrichment." >> "$GITHUB_STEP_SUMMARY"
          echo "LinkedIn was NOT scraped or logged into; X-ray requires separately opted-in Brave public search." >> "$GITHUB_STEP_SUMMARY"
          echo "Inspect private artifacts for profiles, emails, evidence and unverified-fit flags." >> "$GITHUB_STEP_SUMMARY"
